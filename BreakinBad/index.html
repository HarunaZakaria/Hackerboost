<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Breaking Bad Quates</title>
  </head>
  <body>
    <div class="container">
      <h1 class="header">"Breaking Bad"</h1>
      <div>
        <img src="images/breakingbad.jpg" alt="breaking bad" class="image" />
        <p class="display-quote">Quote will be display here</p>
        <div class="author-counter">
          <p>author: <span class="author"></span></p>
          <p class="quote-counter">Quote counter will be here</p>
        </div>
        <button class="quote-btn">Get New Quote</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
